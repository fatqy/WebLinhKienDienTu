spring.application.name=DoAn

# MySQL Laragon Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/doan_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# HikariCP Configuration (Fix: Failed to validate connection)
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.validation-timeout=5000

# Show SQL in logs
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# App configuration
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

# OAuth2 Configuration (Placeholder)
# Google
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=profile,email

# Facebook (Yêu cầu QA: Thiết lập thông tin để dùng Facebook Login)
# Vui lòng tạo App tại https://developers.facebook.com, lấy App ID và App Secret dán vào đây:
spring.security.oauth2.client.registration.facebook.client-id=BẠN_ĐIỀN_FACEBOOK_APP_ID_VÀO_ĐÂY
spring.security.oauth2.client.registration.facebook.client-secret=BẠN_ĐIỀN_FACEBOOK_APP_SECRET_VÀO_ĐÂY
spring.security.oauth2.client.registration.facebook.scope=public_profile,email

# Gemini AI Configuration
gemini.api.key=YOUR_GEMINI_API_KEY
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

# Mail Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_GMAIL@gmail.com
spring.mail.password=YOUR_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

