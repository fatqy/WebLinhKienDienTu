<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::content})}">
<body>
    <div th:fragment="content">
        <!-- Page Header -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-8 gap-4">
            <div>
                <h1 class="text-2xl font-black text-slate-900 dark:text-white tracking-tight">Quản lý sản phẩm</h1>
                <p class="text-sm font-bold text-slate-500 dark:text-slate-400">Danh sách toàn bộ linh kiện trong hệ thống</p>
            </div>
            <button data-modal-target="addModal" data-modal-toggle="addModal" class="flex items-center justify-center px-5 py-2.5 text-sm font-black text-white bg-primary-600 rounded-xl hover:bg-primary-700 shadow-lg shadow-primary-500/20 transition-all">
                <i data-lucide="plus" class="w-4 h-4 mr-2"></i> THÊM SẢN PHẨM
            </button>
        </div>

        <!-- Alerts -->
        <div th:if="${successMessage}" class="p-4 mb-6 text-sm text-green-800 rounded-xl bg-green-50 dark:bg-slate-800 dark:text-green-400 border border-green-200 dark:border-green-800 flex items-center gap-3" role="alert">
            <i data-lucide="check-circle" class="w-5 h-5 flex-shrink-0"></i>
            <span class="font-bold" th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="p-4 mb-6 text-sm text-red-800 rounded-xl bg-red-50 dark:bg-slate-800 dark:text-red-400 border border-red-200 dark:border-red-800 flex items-center gap-3" role="alert">
            <i data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0"></i>
            <span class="font-bold" th:text="${errorMessage}"></span>
        </div>

        <!-- Product Table Card -->
        <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-3xl shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left text-slate-500 dark:text-slate-400">
                    <thead class="text-xs text-slate-700 uppercase bg-slate-50 dark:bg-slate-700/50 dark:text-slate-300">
                        <tr>
                            <th class="px-6 py-4 font-black tracking-wider text-center">Ảnh</th>
                            <th class="px-6 py-4 font-black tracking-wider">Tên sản phẩm</th>
                            <th class="px-6 py-4 font-black tracking-wider">Danh mục</th>
                            <th class="px-6 py-4 font-black tracking-wider text-right">Giá bán</th>
                            <th class="px-6 py-4 font-black tracking-wider text-center">Tồn kho</th>
                            <th class="px-6 py-4 font-black tracking-wider text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 dark:divide-slate-700">
                        <tr th:each="p : ${products}" class="hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors">
                            <td class="px-6 py-4 text-center">
                                <div class="w-12 h-12 rounded-xl bg-white p-1 border border-slate-100 dark:border-slate-600 flex items-center justify-center mx-auto shadow-sm">
                                    <img th:src="${p.imageUrl}" class="max-w-full max-h-full object-contain">
                                </div>
                            </td>
                            <td class="px-6 py-4">
                                <div class="font-black text-slate-900 dark:text-white mb-0.5" th:text="${p.name}">Sản phẩm</div>
                                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest" th:text="${p.brand != null ? p.brand : 'Chưa có hãng'}">Brand</div>
                            </td>
                            <td class="px-6 py-4">
                                <span class="px-3 py-1 text-[10px] font-black uppercase bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-lg" th:text="${p.category != null ? p.category.name : 'N/A'}">Category</span>
                            </td>
                            <td class="px-6 py-4 text-right font-black text-primary-600 dark:text-primary-400" th:text="${p.getFormattedSalePrice()}">0₫</td>
                            <td class="px-6 py-4 text-center">
                                <div class="inline-flex items-center">
                                    <span class="font-black text-slate-900 dark:text-white" th:text="${p.stock}">0</span>
                                    <span th:if="${p.stock <= 5}" class="ml-2 flex w-2 h-2 bg-red-500 rounded-full animate-ping"></span>
                                </div>
                            </td>
                            <td class="px-6 py-4 text-center">
                                <div class="flex items-center justify-center gap-2">
                                    <button class="p-2 text-slate-400 hover:text-amber-500 transition-colors"
                                            th:attr="data-id=${p.id},
                                                    data-catid=${p.category != null ? p.category.id : 0},
                                                    data-name=${p.name},
                                                    data-op=${p.originalPrice},
                                                    data-sp=${p.salePrice},
                                                    data-stock=${p.stock},
                                                    data-img=${p.imageUrl},
                                                    data-extra=${p.extraImages},
                                                    data-badge=${p.badge},
                                                    data-brand=${p.brand},
                                                    data-desc=${p.description}"
                                            onclick="prepareEditModal(this)">
                                        <i data-lucide="edit-3" class="w-5 h-5"></i>
                                    </button>
                                    <a th:href="@{/admin/products/delete/{id}(id=${p.id})}" class="p-2 text-slate-400 hover:text-red-500 transition-colors" onclick="return confirm('Xác nhận xóa?')">
                                        <i data-lucide="trash-2" class="w-5 h-5"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Modal Thêm (Tailwind) -->
        <div id="addModal" tabindex="-1" aria-hidden="true" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
            <div class="relative p-4 w-full max-w-2xl max-h-full">
                <div class="relative bg-white rounded-3xl shadow dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
                    <div class="flex items-center justify-between p-6 border-b dark:border-slate-700">
                        <h3 class="text-xl font-black text-slate-900 dark:text-white uppercase tracking-tight">Thêm sản phẩm mới</h3>
                        <button type="button" class="text-slate-400 bg-transparent hover:bg-slate-100 hover:text-slate-900 rounded-xl text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-slate-700 dark:hover:text-white" data-modal-toggle="addModal">
                            <i data-lucide="x" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <form th:action="@{/admin/products/add}" method="post" enctype="multipart/form-data" class="p-6 space-y-6">
                        <div class="grid grid-cols-2 gap-6">
                            <div class="col-span-2">
                                <label class="block mb-2 text-xs font-black text-slate-900 dark:text-slate-300 uppercase tracking-widest">Tên sản phẩm</label>
                                <input type="text" name="name" required class="bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-primary-500 focus:border-primary-500 block w-full p-3 dark:bg-slate-700 dark:border-slate-600 dark:text-white font-bold">
                            </div>
                            <div class="col-span-2 sm:col-span-1">
                                <label class="block mb-2 text-xs font-black text-slate-900 dark:text-slate-300 uppercase tracking-widest">Danh mục</label>
                                <select name="categoryId" class="bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-primary-500 focus:border-primary-500 block w-full p-3 dark:bg-slate-700 dark:border-slate-600 dark:text-white font-bold">
                                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                                </select>
                            </div>
                            <div class="col-span-2 sm:col-span-1">
                                <label class="block mb-2 text-xs font-black text-slate-900 dark:text-slate-300 uppercase tracking-widest">Thương hiệu</label>
                                <input type="text" name="brand" class="bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-primary-500 focus:border-primary-500 block w-full p-3 dark:bg-slate-700 dark:border-slate-600 dark:text-white font-bold">
                            </div>
                            <div>
                                <label class="block mb-2 text-xs font-black text-slate-900 dark:text-slate-300 uppercase tracking-widest">Giá gốc</label>
                                <input type="number" name="originalPrice" max="999999999" required class="bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-primary-500 focus:border-primary-500 block w-full p-3 dark:bg-slate-700 dark:border-slate-600 dark:text-white font-bold">
                            </div>
                            <div>
                                <label class="block mb-2 text-xs font-black text-slate-900 dark:text-slate-300 uppercase tracking-widest">Giá khuyến mãi</label>
                                <input type="number" name="salePrice" max="999999999" class="bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-primary-500 focus:border-primary-500 block w-full p-3 dark:bg-slate-700 dark:border-slate-600 dark:text-white font-bold">
                            </div>
                            <div>
                                <label class="block mb-2 text-xs font-black text-slate-900 dark:text-slate-300 uppercase tracking-widest">Tồn kho</label>
                                <input type="number" name="stock" max="999999" required class="bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-primary-500 focus:border-primary-500 block w-full p-3 dark:bg-slate-700 dark:border-slate-600 dark:text-white font-bold">
                            </div>
                            <div>
                                <label class="block mb-2 text-xs font-black text-slate-900 dark:text-slate-300 uppercase tracking-widest">Nhãn (Badge)</label>
                                <input type="text" name="badge" placeholder="Hot, New..." class="bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-primary-500 focus:border-primary-500 block w-full p-3 dark:bg-slate-700 dark:border-slate-600 dark:text-white font-bold">
                            </div>
                            <div class="col-span-2">
                                <div class="flex items-center justify-between mb-2">
                                    <label class="text-xs font-black text-slate-900 dark:text-slate-300 uppercase tracking-widest">Mô tả sản phẩm (HTML)</label>
                                    <button type="button" onclick="generateTemplate('add')" class="flex items-center text-xs font-bold text-emerald-600 hover:text-emerald-800 transition-colors">
                                        <i data-lucide="layout-template" class="w-4 h-4 mr-1"></i> Sinh mẫu tự động
                                    </button>
                                </div>
                                <textarea id="addDescription" name="description" rows="4" class="bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-primary-500 focus:border-primary-500 block w-full p-3 dark:bg-slate-700 dark:border-slate-600 dark:text-white font-bold"></textarea>
                            </div>
                            <div class="col-span-2 sm:col-span-1">
                                <label class="block mb-2 text-xs font-black text-slate-900 dark:text-slate-300 uppercase tracking-widest">Ảnh chính (Tải lên)</label>
                                <input type="file" name="imageFile" accept="image/*" class="bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-primary-500 focus:border-primary-500 block w-full p-2 dark:bg-slate-700 dark:border-slate-600 dark:text-white">
                            </div>
                            <div class="col-span-2 sm:col-span-1">
                                <label class="block mb-2 text-xs font-black text-slate-900 dark:text-slate-300 uppercase tracking-widest">Ảnh phụ (Chọn nhiều)</label>
                                <input type="file" name="extraImageFiles" accept="image/*" multiple class="bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-primary-500 focus:border-primary-500 block w-full p-2 dark:bg-slate-700 dark:border-slate-600 dark:text-white">
                            </div>
                        </div>
                        <div class="flex items-center p-6 space-x-3 border-t dark:border-slate-700 rounded-b">
                            <button type="submit" class="w-full text-white bg-primary-600 hover:bg-primary-700 focus:ring-4 focus:outline-none focus:ring-primary-300 font-black rounded-xl text-sm px-5 py-3 text-center transition-all">LƯU SẢN PHẨM</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Modal Sửa (Dùng Flowbite JS) -->
        <div id="editModal" tabindex="-1" aria-hidden="true" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
            <div class="relative p-4 w-full max-w-2xl max-h-full">
                <div class="relative bg-white rounded-3xl shadow dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
                    <div class="flex items-center justify-between p-6 border-b dark:border-slate-700">
                        <h3 class="text-xl font-black text-slate-900 dark:text-white uppercase tracking-tight">Cập nhật sản phẩm</h3>
                        <button type="button" class="text-slate-400 bg-transparent hover:bg-slate-100 hover:text-slate-900 rounded-xl text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-slate-700 dark:hover:text-white" onclick="hideEditModal()">
                            <i data-lucide="x" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <form th:action="@{/admin/products/edit}" method="post" enctype="multipart/form-data" class="p-6 space-y-6">
                        <input type="hidden" id="editProductId" name="id">
                        <div class="grid grid-cols-2 gap-6">
                            <div class="col-span-2">
                                <label class="block mb-2 text-xs font-black text-slate-900 dark:text-slate-300 uppercase tracking-widest">Tên sản phẩm</label>
                                <input type="text" id="editName" name="name" required class="bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-primary-500 focus:border-primary-500 block w-full p-3 dark:bg-slate-700 dark:border-slate-600 dark:text-white font-bold">
                            </div>
                            <div class="col-span-2 sm:col-span-1">
                                <label class="block mb-2 text-xs font-black text-slate-900 dark:text-slate-300 uppercase tracking-widest">Danh mục</label>
                                <select id="editCategoryId" name="categoryId" class="bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-primary-500 focus:border-primary-500 block w-full p-3 dark:bg-slate-700 dark:border-slate-600 dark:text-white font-bold">
                                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                                </select>
                            </div>
                            <div class="col-span-2 sm:col-span-1">
                                <label class="block mb-2 text-xs font-black text-slate-900 dark:text-slate-300 uppercase tracking-widest">Thương hiệu</label>
                                <input type="text" id="editBrand" name="brand" class="bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-primary-500 focus:border-primary-500 block w-full p-3 dark:bg-slate-700 dark:border-slate-600 dark:text-white font-bold">
                            </div>
                            <div>
                                <label class="block mb-2 text-xs font-black text-slate-900 dark:text-slate-300 uppercase tracking-widest">Giá gốc</label>
                                <input type="number" id="editOriginalPrice" name="originalPrice" max="999999999" required class="bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-primary-500 focus:border-primary-500 block w-full p-3 dark:bg-slate-700 dark:border-slate-600 dark:text-white font-bold">
                            </div>
                            <div>
                                <label class="block mb-2 text-xs font-black text-slate-900 dark:text-slate-300 uppercase tracking-widest">Giá khuyến mãi</label>
                                <input type="number" id="editSalePrice" name="salePrice" max="999999999" class="bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-primary-500 focus:border-primary-500 block w-full p-3 dark:bg-slate-700 dark:border-slate-600 dark:text-white font-bold">
                            </div>
                            <div>
                                <label class="block mb-2 text-xs font-black text-slate-900 dark:text-slate-300 uppercase tracking-widest">Tồn kho</label>
                                <input type="number" id="editStock" name="stock" max="999999" required class="bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-primary-500 focus:border-primary-500 block w-full p-3 dark:bg-slate-700 dark:border-slate-600 dark:text-white font-bold">
                            </div>
                            <div>
                                <label class="block mb-2 text-xs font-black text-slate-900 dark:text-slate-300 uppercase tracking-widest">Nhãn (Badge)</label>
                                <input type="text" id="editBadge" name="badge" class="bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-primary-500 focus:border-primary-500 block w-full p-3 dark:bg-slate-700 dark:border-slate-600 dark:text-white font-bold">
                            </div>
                            <div class="col-span-2">
                                <div class="flex items-center justify-between mb-2">
                                    <label class="text-xs font-black text-slate-900 dark:text-slate-300 uppercase tracking-widest">Mô tả sản phẩm</label>
                                    <button type="button" onclick="generateTemplate('edit')" class="flex items-center text-xs font-bold text-emerald-600 hover:text-emerald-800 transition-colors">
                                        <i data-lucide="layout-template" class="w-4 h-4 mr-1"></i> Sinh mẫu tự động
                                    </button>
                                </div>
                                <textarea id="editDescription" name="description" rows="4" class="bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-primary-500 focus:border-primary-500 block w-full p-3 dark:bg-slate-700 dark:border-slate-600 dark:text-white font-bold"></textarea>
                            </div>
                            <div class="col-span-2 sm:col-span-1">
                                <label class="block mb-2 text-xs font-black text-slate-900 dark:text-slate-300 uppercase tracking-widest">Đổi ảnh chính (Bỏ trống nếu giữ nguyên)</label>
                                <input type="file" name="imageFile" accept="image/*" class="bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-primary-500 focus:border-primary-500 block w-full p-2 dark:bg-slate-700 dark:border-slate-600 dark:text-white">
                            </div>
                            <div class="col-span-2 sm:col-span-1">
                                <label class="block mb-2 text-xs font-black text-slate-900 dark:text-slate-300 uppercase tracking-widest">Thêm ảnh phụ (Chọn nhiều)</label>
                                <input type="file" name="extraImageFiles" accept="image/*" multiple class="bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-primary-500 focus:border-primary-500 block w-full p-2 dark:bg-slate-700 dark:border-slate-600 dark:text-white">
                            </div>
                        </div>
                        <div class="flex items-center p-6 space-x-3 border-t dark:border-slate-700 rounded-b">
                            <button type="submit" class="w-full text-white bg-primary-600 hover:bg-primary-700 focus:ring-4 focus:outline-none focus:ring-primary-300 font-black rounded-xl text-sm px-5 py-3 text-center transition-all">CẬP NHẬT THAY ĐỔI</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <script th:inline="javascript">
            let editModal;
            document.addEventListener('DOMContentLoaded', function() {
                const $targetEl = document.getElementById('editModal');
                editModal = new Modal($targetEl);
            });

            function prepareEditModal(btn) {
                document.getElementById('editProductId').value = btn.getAttribute('data-id');
                document.getElementById('editCategoryId').value = btn.getAttribute('data-catid');
                document.getElementById('editName').value = btn.getAttribute('data-name');
                document.getElementById('editOriginalPrice').value = btn.getAttribute('data-op');
                document.getElementById('editSalePrice').value = btn.getAttribute('data-sp');
                document.getElementById('editStock').value = btn.getAttribute('data-stock');
                // Không gán value cho input file (bảo mật trình duyệt không cho phép)
                document.getElementById('editDescription').value = btn.getAttribute('data-desc');
                
                let badge = btn.getAttribute('data-badge');
                document.getElementById('editBadge').value = (badge === 'null' || !badge) ? '' : badge;
                
                let brand = btn.getAttribute('data-brand');
                document.getElementById('editBrand').value = (brand === 'null' || !brand) ? '' : brand;
                
                editModal.show();
            }

            function hideEditModal() {
                editModal.hide();
            }

            function generateTemplate(type) {
                let nameInput, categorySelect, brandInput, descInput;
                if (type === 'add') {
                    nameInput = document.querySelector('#addModal input[name="name"]');
                    categorySelect = document.querySelector('#addModal select[name="categoryId"]');
                    brandInput = document.querySelector('#addModal input[name="brand"]');
                    descInput = document.getElementById('addDescription');
                } else {
                    nameInput = document.getElementById('editName');
                    categorySelect = document.getElementById('editCategoryId');
                    brandInput = document.getElementById('editBrand');
                    descInput = document.getElementById('editDescription');
                }

                if (!nameInput.value) {
                    alert('Vui lòng nhập tên sản phẩm trước khi sinh mẫu mô tả!');
                    nameInput.focus();
                    return;
                }

                const categoryName = categorySelect.options[categorySelect.selectedIndex].text.toLowerCase();
                const productName = nameInput.value;
                const brand = brandInput.value ? brandInput.value : 'Đang cập nhật';
                
                let template = '';
                
                if (categoryName.includes('laptop') || categoryName.includes('máy tính xách tay')) {
                    template = `<h3>Đặc điểm nổi bật của Laptop ${productName}</h3>
<ul>
    <li><b>Vi xử lý (CPU):</b> Đang cập nhật...</li>
    <li><b>RAM:</b> Đang cập nhật...</li>
    <li><b>Ổ cứng:</b> Đang cập nhật...</li>
    <li><b>Card đồ họa (VGA):</b> Đang cập nhật...</li>
    <li><b>Màn hình:</b> Đang cập nhật...</li>
</ul>
<p>Sản phẩm chính hãng <b>${brand}</b> mang lại trải nghiệm tuyệt vời cho nhu cầu học tập, làm việc và giải trí.</p>`;
                } else if (categoryName.includes('chuột') || categoryName.includes('bàn phím') || categoryName.includes('gaming gear')) {
                    template = `<h3>Thông số kỹ thuật ${productName}</h3>
<ul>
    <li><b>Thương hiệu:</b> ${brand}</li>
    <li><b>Kết nối:</b> Không dây / Có dây</li>
    <li><b>Kiểu thiết kế:</b> Đang cập nhật...</li>
    <li><b>Tính năng đặc biệt:</b> Đang cập nhật...</li>
</ul>
<p>Thiết bị hoàn hảo để tối ưu tốc độ và sự thoải mái trong thời gian dài sử dụng.</p>`;
                } else if (categoryName.includes('màn hình')) {
                    template = `<h3>Đánh giá chi tiết Màn hình ${productName}</h3>
<ul>
    <li><b>Kích thước:</b> Đang cập nhật...</li>
    <li><b>Độ phân giải:</b> FHD / 2K / 4K</li>
