<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu – EWMI</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .login-container { max-width: 450px; margin: 80px auto; background: var(--item-bg); padding: 40px; border-radius: 24px; color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .login-header { text-align: center; margin-bottom: 35px; }
        .login-header h2 { font-size: 26px; font-weight: bold; margin-top: 15px; }
        .form-group { margin-bottom: 25px; position: relative; }
        .form-group label { display: block; margin-bottom: 10px; font-size: 14px; color: #ccc; }
        .form-group input { width: 100%; padding: 12px 15px; background: #333; border: 1px solid #555; border-radius: 12px; color: #fff; outline: none; }
        .btn-submit { width: 100%; padding: 15px; background: var(--primary-blue); color: #fff; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 17px; transition: 0.3s; }
        .btn-submit:hover { opacity: 0.9; }
        .alert-error { color: #ff6b6b; background: rgba(255,107,107,0.1); border: 1px solid rgba(255,107,107,0.2); padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-size: 14px; }
    </style>
</head>
<body style="background: var(--body-bg);">
    <div class="login-container">
        <div class="login-header">
            <a href="/" class="ewmi-logo-container" style="justify-content: center; margin-bottom: 20px;">
                <span class="ewmi-logo-text" style="font-size: 36px;">EWMI</span>
                <span class="ewmi-dot" style="width: 10px; height: 10px; margin-top: 15px;"></span>
            </a>
            <h2>Mật khẩu mới</h2>
            <p style="color: #888; font-size: 14px; margin-top: 10px;">Nhập mật khẩu mới cho tài khoản của bạn.</p>
        </div>

        <form th:action="@{/reset-password}" method="post">
            <input type="hidden" name="token" th:value="${token}">
            <div class="form-group">
                <label>Mật khẩu mới</label>
                <input type="password" name="password" id="password" placeholder="Tối thiểu 6 ký tự" required minlength="6">
            </div>
            <div class="form-group">
                <label>Xác nhận mật khẩu</label>
                <input type="password" name="confirmPassword" id="confirmPassword" placeholder="Nhập lại mật khẩu" required minlength="6">
            </div>
            <button type="submit" class="btn-submit">XÁC NHẬN ĐỔI MẬT KHẨU</button>
        </form>
    </div>

    <script>
        document.querySelector('form').addEventListener('submit', function(e) {
            const pass = document.querySelector('#password').value;
            const confirm = document.querySelector('#confirmPassword').value;
            if (pass !== confirm) {
                e.preventDefault();
                alert('Mật khẩu xác nhận không khớp!');
            }
        });
    </script>
</body>
</html>
