<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Hồ sơ cá nhân')}"></head>
<style>
    .profile-container { max-width: 900px; margin: 50px auto; display: flex; gap: 30px; color: #fff; }
    .profile-sidebar { flex: 1; background: var(--item-bg); padding: 30px; border-radius: 24px; height: fit-content; }
    .profile-main { flex: 2; background: var(--item-bg); padding: 40px; border-radius: 24px; }
    .sidebar-menu { list-style: none; margin-top: 25px; }
    .sidebar-menu li { margin-bottom: 12px; }
    .sidebar-menu a { display: block; padding: 12px 15px; color: #ccc; border-radius: 12px; transition: 0.3s; font-size: 15px; }
    .sidebar-menu a:hover, .sidebar-menu a.active { background: #444; color: var(--primary-blue); font-weight: 600; }
    .form-group { margin-bottom: 25px; }
    .form-group label { display: block; margin-bottom: 10px; font-size: 14px; color: #aaa; }
    .form-group input { width: 100%; padding: 12px 15px; background: #333; border: 1px solid #555; border-radius: 12px; color: #fff; outline: none; }
    .btn-update { background: var(--primary-blue); color: white; border: none; padding: 15px 35px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .btn-update:hover { opacity: 0.9; }
    .alert-success { background: rgba(46,204,113,0.1); color: #2ecc71; padding: 15px; border-radius: 12px; margin-bottom: 25px; border: 1px solid rgba(46,204,113,0.2); text-align: center; }
    .user-avatar { width: 90px; height: 90px; background: #444; border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 35px; color: #888; border: 3px solid #555; }
</style>
<body>
    <header th:replace="~{fragments :: header}"></header>

    <main class="main">
        <div class="container profile-container">
            <!-- Sidebar -->
            <aside class="profile-sidebar">
                <div style="text-align: center; margin-bottom: 20px;">
                    <div class="user-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <h3 th:text="${user.fullName}" style="margin-top: 15px; font-size: 18px;">User Full Name</h3>
                    <p th:text="${user.username}" style="font-size: 13px; color: #888;">@username</p>
                </div>
                <ul class="sidebar-menu">
                    <li><a href="/profile" class="active"><i class="fas fa-id-card"></i> Thông tin cá nhân</a></li>
                    <li><a href="/order-history"><i class="fas fa-history"></i> Lịch sử mua hàng</a></li>
                    <li><a href="/logout" style="color: #e74c3c; border-top: 1px solid #444; margin-top: 15px; padding-top: 20px;"><i class="fas fa-sign-out-alt"></i> Đăng xuất</a></li>
                </ul>
            </aside>

            <!-- Main Content -->
            <div class="profile-main">
                <h2 style="margin-bottom: 30px; font-size: 24px; border-left: 4px solid var(--primary-blue); padding-left: 15px;">Thông tin tài khoản</h2>
                
                <div th:if="${param.success}" class="alert-success">
                    Cập nhật thông tin thành công!
                </div>

                <form th:action="@{/profile/update}" method="post">
                    <div class="form-group">
                        <label>Họ và tên</label>
                        <input type="text" name="fullName" th:value="${user.fullName}" placeholder="Họ và tên của bạn">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" th:value="${user.email}" placeholder="Địa chỉ email">
                    </div>
                    <div class="form-group">
                        <label>Số điện thoại</label>
                        <input type="text" name="phoneNumber" th:value="${user.phoneNumber}" placeholder="Số điện thoại">
                    </div>
                    <div class="form-group">
                        <label>Địa chỉ mặc định</label>
                        <input type="text" name="address" th:value="${user.address}" placeholder="Địa chỉ giao hàng">
                    </div>
                    <button type="submit" class="btn-update">CẬP NHẬT THÔNG TIN</button>
                </form>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
