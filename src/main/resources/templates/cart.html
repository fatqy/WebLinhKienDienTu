<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Giỏ hàng')}"></head>
<style>
    .cart-table { width: 100%; border-collapse: collapse; margin-top: 30px; background: var(--item-bg); border-radius: 12px; overflow: hidden; color: #fff; }
    .cart-table th, .cart-table td { padding: 20px; text-align: left; border-bottom: 1px solid #444; }
    .cart-table th { background: #444; text-transform: uppercase; font-size: 14px; }
    .cart-product-img { width: 80px; height: 80px; object-fit: contain; background: #fff; border-radius: 8px; padding: 5px; }
    .cart-summary { margin-top: 40px; background: var(--item-bg); padding: 30px; border-radius: 24px; max-width: 450px; margin-left: auto; color: #fff; }
    .summary-row { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 18px; }
    .total-price { color: var(--primary-blue); font-weight: bold; font-size: 26px; }
    .btn-checkout { background: var(--primary-blue); color: white; border: none; padding: 18px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 18px; margin-top: 20px; transition: 0.3s; }
    .btn-checkout:hover { opacity: 0.9; transform: scale(1.02); }
    .btn-remove { color: #999; cursor: pointer; transition: 0.3s; }
    .btn-remove:hover { color: #e74c3c; }
    input[type="number"] { background: #333; color: #fff; border: 1px solid #555; padding: 8px; border-radius: 6px; }
</style>
<body>
    <header th:replace="~{fragments :: header}"></header>

    <main class="main">
        <div class="container">
            <div th:if="${#lists.isEmpty(cartItems)}" style="text-align: center; padding: 100px 0; color: #ccc;">
                <i class="fas fa-shopping-cart" style="font-size: 80px; color: #555; margin-bottom: 20px;"></i>
                <h2>Giỏ hàng của bạn đang trống!</h2>
                <p>Hãy dạo một vòng website để chọn những sản phẩm ưng ý nhé.</p>
                <a href="/" class="btn-checkout" style="display: inline-block; width: auto; padding: 15px 40px; margin-top: 20px;">QUAY LẠI CỬA HÀNG</a>
            </div>

            <div th:if="${not #lists.isEmpty(cartItems)}" style="padding-top: 30px;">
                <h1 style="color: #fff; font-size: 28px; margin-bottom: 20px;">Giỏ hàng của bạn</h1>
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th colspan="2">Sản phẩm</th>
                            <th>Đơn giá</th>
                            <th>Số lượng</th>
                            <th>Thành tiền</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${cartItems}">
                            <td><img th:src="${item.product.imageUrl}" class="cart-product-img"></td>
                            <td>
                                <div th:text="${item.product.name}" style="font-weight: 500; font-size: 16px;">Product Name</div>
                                <div style="font-size: 12px; color: #aaa; margin-top: 5px;" th:text="'Kho: ' + ${item.product.stock}">Kho: 10</div>
                            </td>
                            <td th:text="${item.product.getFormattedCurrentPrice()}">Price</td>
                            <td>
                                <input type="number" th:value="${item.quantity}" min="1" th:max="${item.product.stock}" 
                                       th:onchange="'updateQuantity(' + ${item.id} + ', this.value)'"
                                       style="width: 60px;">
                            </td>
                            <td th:text="${#numbers.formatDecimal((item.product.salePrice > 0 ? item.product.salePrice : item.product.originalPrice) * item.quantity, 0, 'COMMA', 0, 'POINT') + '₫'}" 
                                style="font-weight: bold; color: var(--primary-blue);">Total</td>
                            <td>
                                <a th:href="@{/cart/remove/{id}(id=${item.id})}" class="btn-remove">
                                    <i class="fas fa-trash-alt"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <div class="cart-summary">
                    <div class="summary-row">
                        <span>Tổng cộng:</span>
                        <span class="total-price" th:text="${#numbers.formatDecimal(total, 0, 'COMMA', 0, 'POINT') + '₫'}">Total</span>
                    </div>
                    <a href="/checkout" class="btn-checkout" style="display: block; text-align: center; text-decoration: none;">TIẾN HÀNH THANH TOÁN</a>
                    <div style="text-align: center; margin-top: 20px;">
                        <a href="/" style="color: #aaa; font-size: 14px;"><i class="fas fa-reply"></i> Tiếp tục mua hàng</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script th:inline="javascript">
        function updateQuantity(id, quantity) {
            if (quantity < 1) return;
            const formData = new FormData();
            formData.append('id', id);
            formData.append('quantity', quantity);
            
            // Add CSRF token
            const csrfParam = /*[[${_csrf.parameterName}]]*/ '_csrf';
            const csrfToken = /*[[${_csrf.token}]]*/ '';
            formData.append(csrfParam, csrfToken);

            fetch('/cart/update', {
                method: 'POST',
                body: formData
            }).then(response => {
                if (response.ok) {
                    location.reload();
                } else {
                    alert('Lỗi cập nhật giỏ hàng. Vui lòng thử lại.');
                }
            });
        }
    </script>

    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
