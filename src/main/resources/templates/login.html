<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập – EWMI</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .login-container { max-width: 450px; margin: 80px auto; background: var(--item-bg); padding: 40px; border-radius: 24px; color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .login-header { text-align: center; margin-bottom: 35px; }
        .login-header h2 { font-size: 26px; font-weight: bold; margin-top: 15px; }
        .form-group { margin-bottom: 25px; position: relative; }
        .form-group label { display: block; margin-bottom: 10px; font-size: 14px; color: #ccc; }
        .form-group input { width: 100%; padding: 12px 15px; background: #333; border: 1px solid #555; border-radius: 12px; color: #fff; outline: none; }
        .password-toggle { position: absolute; right: 15px; top: 43px; cursor: pointer; color: #888; }
        .btn-login { width: 100%; padding: 15px; background: var(--primary-blue); color: #fff; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 17px; transition: 0.3s; }
        .btn-login:hover { opacity: 0.9; }
        .social-login { margin-top: 30px; padding-top: 25px; border-top: 1px solid #444; text-align: center; }
        .social-login p { font-size: 13px; color: #888; margin-bottom: 20px; }
        .social-btns { display: flex; gap: 15px; justify-content: center; }
        .social-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-google { background: #fff; color: #333; }
        .btn-facebook { background: #1877F2; color: #fff; }
        .social-btn:hover { opacity: 0.8; }
        .login-footer { margin-top: 25px; text-align: center; font-size: 14px; color: #aaa; }
        .login-footer a { color: var(--primary-blue); font-weight: 600; }
        .forgot-link { display: block; text-align: right; margin-top: -15px; margin-bottom: 20px; font-size: 13px; color: #aaa; text-decoration: none; }
        .forgot-link:hover { color: var(--primary-blue); }
        .error-msg { color: #ff6b6b; background: rgba(255,107,107,0.1); padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; text-align: center; border: 1px solid rgba(255,107,107,0.2); }
    </style>
</head>
<body style="background: var(--body-bg);">
    <div class="login-container">
        <div class="login-header">
            <a href="/" class="ewmi-logo-container" style="justify-content: center; margin-bottom: 20px;">
                <span class="ewmi-logo-text" style="font-size: 36px;">EWMI</span>
                <span class="ewmi-dot" style="width: 10px; height: 10px; margin-top: 15px;"></span>
            </a>
            <h2>Đăng nhập</h2>
        </div>

        <div th:if="${param.error}" class="error-msg">Tên đăng nhập hoặc mật khẩu không đúng.</div>
        <div th:if="${param.logout}" class="error-msg" style="color: #2ecc71; background: rgba(46,204,113,0.1); border-color: rgba(46,204,113,0.2);">Bạn đã đăng xuất.</div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>Tên đăng nhập</label>
                <input type="text" name="username" placeholder="Nhập tài khoản" required>
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
                <i class="fa-solid fa-eye-slash password-toggle" id="togglePassword"></i>
            </div>
            <a href="/forgot-password" class="forgot-link">Quên mật khẩu?</a>
            <button type="submit" class="btn-login">ĐĂNG NHẬP</button>
        </form>

        <!-- Social Login Section -->
        <div class="social-login">
            <p>Hoặc đăng nhập nhanh bằng</p>
            <div class="social-btns">
                <a th:href="@{/oauth2/authorization/google}" class="social-btn btn-google">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" width="18" height="18">
                    Google
                </a>
                <a th:href="@{/oauth2/authorization/facebook}" class="social-btn btn-facebook">
                    <i class="fab fa-facebook-f"></i>
                    Facebook
                </a>
            </div>
        </div>

        <div class="login-footer">
            Chưa có tài khoản? <a href="/register">Đăng ký ngay</a>
        </div>
    </div>

    <script>
        document.querySelector('#togglePassword').addEventListener('click', function (e) {
            const password = document.querySelector('#password');
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
    </script>
</body>
</html>
