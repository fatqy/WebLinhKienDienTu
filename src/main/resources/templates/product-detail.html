<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${product.name})}"></head>
<style>
    .product-detail-container { display: flex; gap: 40px; background: var(--item-bg); padding: 30px; border-radius: 24px; margin-top: 20px; color: #fff; }
    .product-detail-image { flex: 1; text-align: center; background: #fff; border-radius: 12px; padding: 20px; }
    .product-detail-image img { max-width: 100%; height: auto; transition: 0.3s; }
    .product-detail-info { flex: 1.5; }
    .product-detail-info h1 { font-size: 28px; margin-bottom: 20px; font-weight: bold; }
    .price-box { background: #444; padding: 25px; border-radius: 12px; margin: 25px 0; }
    .detail-current-price { color: #fff; font-size: 32px; font-weight: bold; }
    .detail-original-price { color: #aaa; text-decoration: line-through; margin-left: 15px; font-size: 20px; }
    .stock-status { margin-bottom: 20px; font-weight: 500; font-size: 16px; }
    .quantity-selector { display: flex; align-items: center; gap: 15px; margin-bottom: 30px; }
    .quantity-selector input { width: 70px; padding: 10px; text-align: center; border: 1px solid #555; background: #333; color: #fff; border-radius: 8px; }
    .btn-buy-now { background: var(--primary-blue); color: white; border: none; padding: 18px 40px; border-radius: 12px; font-size: 20px; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; }
    .btn-buy-now:hover { opacity: 0.9; transform: scale(1.02); }
    .product-description { margin-top: 50px; padding: 30px; background: var(--item-bg); border-radius: 24px; color: #fff; }
    .product-description h2 { border-left: 4px solid var(--primary-blue); padding-left: 15px; margin-bottom: 25px; font-size: 22px; }
    .breadcrumb { margin: 20px 0; font-size: 14px; color: #aaa; }
    .breadcrumb a { color: var(--primary-blue); }
    .reviews-section { margin-top: 50px; background: var(--item-bg); padding: 30px; border-radius: 24px; color: #fff; }
</style>
<body>
    <header th:replace="~{fragments :: header}"></header>

    <main class="main">
        <div class="container">
            <nav class="breadcrumb">
                <a href="/">Trang chủ</a> / 
                <a th:href="@{/category/{id}(id=${product.category.id})}" th:text="${product.category.name}">Category</a> / 
                <span th:text="${product.name}">Product</span>
            </nav>

            <div class="product-detail-container">
                <div class="product-detail-image">
                    <img th:src="${product.imageUrl}" th:alt="${product.name}">
                </div>
                <div class="product-detail-info">
                    <h1 th:text="${product.name}">Product Name</h1>
                    <div class="stock-status">
                        Tình trạng: <span th:style="${product.stock > 0 ? 'color: #2ecc71;' : 'color: #e74c3c;'}" 
                                          th:text="${product.stock > 0 ? 'Còn hàng' : 'Hết hàng'}">Còn hàng</span>
                    </div>
                    
                    <div class="price-box">
                        <span class="detail-current-price" th:text="${product.getFormattedCurrentPrice()}">Price</span>
                        <span class="detail-original-price" th:if="${product.salePrice > 0}" th:text="${product.getFormattedOriginalPrice()}">Old Price</span>
                    </div>

                    <form th:action="@{/cart/add}" method="post">
                        <input type="hidden" name="productId" th:value="${product.id}">
                        <div class="quantity-selector">
                            <span>Số lượng:</span>
                            <input type="number" name="quantity" value="1" min="1" th:max="${product.stock}">
                        </div>
                        <button type="submit" class="btn-buy-now" th:disabled="${product.stock <= 0}">
                            <i class="fas fa-shopping-cart"></i> THÊM VÀO GIỎ HÀNG
                        </button>
                    </form>
                </div>
            </div>

            <div class="product-description">
                <h2>Mô tả sản phẩm</h2>
                <div th:utext="${product.description != null ? product.description : 'Thông tin đang được cập nhật...'}" style="line-height: 1.8; color: #ccc;">Mô tả...</div>
            </div>

            <!-- Đánh giá -->
            <div class="reviews-section">
                <h3 style="margin-bottom: 25px; font-size: 22px;">Đánh giá khách hàng</h3>
                <div th:if="${#lists.isEmpty(product.reviews)}" style="color: #888; font-style: italic;">Chưa có đánh giá nào.</div>
                
                <div th:each="review : ${product.reviews}" th:if="${review.approved}" style="border-bottom: 1px solid #444; padding: 20px 0;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                        <strong th:text="${review.user.fullName}" style="color: #fff;">Tên người dùng</strong>
                        <span style="color: var(--primary-orange);">
                            <i th:each="i : ${#numbers.sequence(1, 5)}" 
                               th:class="${i <= review.rating ? 'fas fa-star' : 'far fa-star'}"></i>
                        </span>
                    </div>
                    <p th:text="${review.comment}" style="color: #ccc;"></p>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
