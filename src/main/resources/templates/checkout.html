<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Thanh toán')}"></head>
<style>
    .checkout-container { display: flex; gap: 40px; margin-top: 30px; margin-bottom: 50px; color: #fff; }
    .checkout-form { flex: 1.5; background: var(--item-bg); padding: 30px; border-radius: 24px; }
    .order-summary-sidebar { flex: 1; background: #444; padding: 25px; border-radius: 24px; height: fit-content; }
    .form-section h3 { border-bottom: 1px solid #555; padding-bottom: 10px; margin-bottom: 25px; text-transform: uppercase; font-size: 18px; color: var(--primary-blue); }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 14px; color: #ccc; }
    .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #555; background: #333; color: #fff; border-radius: 8px; }
    .order-item-mini { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 15px; color: #eee; }
    .total-row { border-top: 1px solid #666; margin-top: 20px; padding-top: 20px; display: flex; justify-content: space-between; font-weight: bold; font-size: 22px; color: var(--primary-blue); }
    .btn-submit { background: var(--primary-blue); color: white; border: none; padding: 18px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 18px; margin-top: 20px; transition: 0.3s; }
    .btn-submit:hover { opacity: 0.9; transform: scale(1.02); }
</style>
<body>
    <header th:replace="~{fragments :: header}"></header>

    <main class="main">
        <div class="container">
            <div class="checkout-container">
                <div class="checkout-form">
                    <form th:action="@{/checkout}" method="post">
                        <div class="form-section">
                            <h3>Thông tin giao hàng</h3>
                            <div class="form-group">
                                <label>Họ và tên người nhận *</label>
                                <input type="text" name="fullName" th:value="${user.fullName}" placeholder="Nhập họ và tên" required>
                            </div>
                            <div class="form-group">
                                <label>Số điện thoại *</label>
                                <input type="text" name="phoneNumber" th:value="${user.phoneNumber}" placeholder="Nhập số điện thoại" required>
                            </div>
                            <div class="form-group">
                                <label>Địa chỉ nhận hàng *</label>
                                <input type="text" name="address" th:value="${user.address}" placeholder="Nhập địa chỉ giao hàng" required>
                            </div>
                        </div>

                        <div class="form-section" style="margin-top: 30px;">
                            <h3>Phương thức thanh toán</h3>
                            <div class="form-group">
                                <select name="paymentMethod">
                                    <option value="COD">Thanh toán khi nhận hàng (COD)</option>
                                    <option value="E-WALLET">Ví điện tử / Chuyển khoản</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-section" style="margin-top: 30px;">
                            <h3>Mã giảm giá</h3>
                            <div class="form-group" style="display: flex; gap: 10px;">
                                <input type="text" name="couponCode" id="couponCode" placeholder="Nhập mã ưu đãi (nếu có)" style="flex: 1;">
                                <button type="button" id="applyCoupon" style="background: #555; color: #fff; border: none; padding: 0 20px; border-radius: 8px; cursor: pointer;">Áp dụng</button>
                            </div>
                            <div id="couponMessage" style="font-size: 13px; margin-top: 5px;"></div>
                        </div>

                        <button type="submit" class="btn-submit">XÁC NHẬN ĐẶT HÀNG</button>
                    </form>
                </div>

                <aside class="order-summary-sidebar">
                    <h3 style="margin-bottom: 20px; font-size: 18px;">Đơn hàng của bạn</h3>
                    <div th:each="item : ${cartItems}" class="order-item-mini">
                        <span th:text="${item.product.name} + ' x' + ${item.quantity}" style="max-width: 70%;">Product Name x1</span>
                        <span th:text="${#numbers.formatDecimal((item.product.salePrice > 0 ? item.product.salePrice : item.product.originalPrice) * item.quantity, 0, 'COMMA', 0, 'POINT') + '₫'}" style="white-space: nowrap;">Price</span>
                    </div>
                    <div class="total-row">
                        <span>TỔNG CỘNG:</span>
                        <span th:text="${#numbers.formatDecimal(total, 0, 'COMMA', 0, 'POINT') + '₫'}">Total</span>
                    </div>
                </aside>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments :: footer}"></footer>

    <script th:inline="javascript">
        const originalTotal = /*[[${total}]]*/ 0;
        const btnApply = document.getElementById('applyCoupon');
        const inputCoupon = document.getElementById('couponCode');
        const msgCoupon = document.getElementById('couponMessage');
        const displayTotal = document.querySelector('.total-row span:last-child');

        btnApply.addEventListener('click', function() {
            const code = inputCoupon.value.trim();
            if (!code) return;

            fetch(`/api/coupon/validate?code=${code}&subtotal=${originalTotal}`)
                .then(res => res.json())
                .then(data => {
                    if (data.valid) {
                        msgCoupon.style.color = '#2ecc71';
                        msgCoupon.textContent = data.message;
                        const newTotal = originalTotal - data.discount;
                        displayTotal.textContent = new Intl.NumberFormat('vi-VN').format(newTotal) + '₫';
                    } else {
                        msgCoupon.style.color = '#ff6b6b';
                        msgCoupon.textContent = data.message;
                        displayTotal.textContent = new Intl.NumberFormat('vi-VN').format(originalTotal) + '₫';
                    }
                });
        });
    </script>
</body>
</html>
