<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Trang chủ')}"></head>
<body>
    <header th:replace="~{fragments :: header}"></header>

    <main class="container">
        <!-- Hero Banner Section -->
        <div class="hero-banner" th:style="'background: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.5)), url(' + ${imageAssets.bannerHome} + ') no-repeat center center/cover;'">
            <div>
                <h1 style="font-size: 52px; font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,0.3);">SĂN DEAL HÈ RỰC RỠ</h1>
                <p style="font-size: 20px; margin-top: 10px;">Ưu đãi lên tới 50% các sản phẩm VGA, CPU, Mainboard</p>
                <a href="/linh-kien-may-tinh" class="add-to-cart" style="display: inline-block; width: auto; padding: 12px 40px; margin-top: 25px; border-radius: 30px; font-size: 16px;">XEM NGAY</a>
            </div>
        </div>

        <!-- Sản phẩm Khuyến mãi Section -->
        <div class="section-title">
            <h2>SĂN DEAL GIÁ HỜI</h2>
            <a href="/linh-kien-may-tinh" class="view-all">XEM TẤT CẢ <i class="fas fa-chevron-right"></i></a>
        </div>
        <div class="product-grid">
            <div th:each="product : ${saleProducts}" class="product-card">
                <div class="product-badge" th:text="'-' + ${product.getDiscountPercentage()} + '%'">-10%</div>
                <a th:href="@{/product/{id}(id=${product.id})}">
                    <img th:src="${product.imageUrl}" th:alt="${product.name}" class="product-image">
                    <div class="product-title" th:text="${product.name}">Product Name</div>
                </a>
                <div class="product-price">
                    <span class="current-price" th:text="${product.getFormattedCurrentPrice()}">0₫</span>
                    <span class="original-price" th:if="${product.salePrice > 0}" th:text="${product.getFormattedOriginalPrice()}">0₫</span>
                </div>
                <form th:action="@{/cart/add}" method="post">
                    <input type="hidden" name="productId" th:value="${product.id}">
                    <input type="hidden" name="quantity" value="1">
                    <button type="submit" class="add-to-cart">THÊM GIỎ HÀNG</button>
                </form>
            </div>
        </div>

        <!-- Sản phẩm Mới Section -->
        <div class="section-title" style="margin-top: 50px;">
            <h2>SẢN PHẨM MỚI NHẤT</h2>
            <a href="/linh-kien-may-tinh" class="view-all">XEM TẤT CẢ <i class="fas fa-chevron-right"></i></a>
        </div>
        <div class="product-grid">
            <div th:each="product : ${newProducts}" class="product-card">
                <div class="product-badge" th:if="${not #strings.isEmpty(product.badge)}" th:text="${product.badge}" style="background: linear-gradient(45deg, #2ecc71, #27ae60);">Mới</div>
                <a th:href="@{/product/{id}(id=${product.id})}">
                    <img th:src="${product.imageUrl}" th:alt="${product.name}" class="product-image">
                    <div class="product-title" th:text="${product.name}">Product Name</div>
                </a>
                <div class="product-price">
                    <span class="current-price" th:text="${product.getFormattedCurrentPrice()}">0₫</span>
                    <span class="original-price" th:if="${product.salePrice > 0}" th:text="${product.getFormattedOriginalPrice()}">0₫</span>
                </div>
                <form th:action="@{/cart/add}" method="post">
                    <input type="hidden" name="productId" th:value="${product.id}">
                    <input type="hidden" name="quantity" value="1">
                    <button type="submit" class="add-to-cart">THÊM GIỎ HÀNG</button>
                </form>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
